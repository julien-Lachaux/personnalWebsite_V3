# Production : Caddy (TLS automatique) devant l'API, PostgreSQL privé.
# Seul `caddy` publie des ports (80/443). Trois réseaux :
#   - edge : réseau Docker ordinaire de Caddy (ports publiés, sortie vers Internet pour le certificat) ;
#   - app  : Caddy, l'API et la génération du front, `internal` (aucune sortie vers Internet) ;
#   - data : l'API, migrate et PostgreSQL, `internal` (Caddy n'y est pas : il ne joint pas la base).
# Conteneurs durcis : système de fichiers en lecture seule, aucune capacité Linux superflue,
# `no-new-privileges`, mémoire et nombre de processus bornés.
# Lancement (depuis la racine du dépôt) :
#   docker compose -f docker/compose.prod.yml --env-file docker/.env.prod up -d --build
# Variables : voir docker/.env.prod.example (le vrai .env.prod n'est jamais commité).

name: siteperso-v3-prod

services:
  caddy:
    image: docker.io/library/caddy:2@sha256:4851e54a46b206517c574821bb5cc67f170d2156041e9fbc4c9193b45e84a75b
    restart: unless-stopped
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
      - '${HTTPS_PORT:-443}:443/udp'
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?SITE_DOMAIN requis}
      PUBLIC_HTTPS_PORT: ${HTTPS_PORT:-443}
      # Mode travaux (docker/wip.caddy) : validé au démarrage par caddy-start.sh (clé de 32 caractères au
      # moins si WIP_MODE=on, sinon le conteneur refuse de démarrer).
      WIP_MODE: ${WIP_MODE:-off}
      WIP_KEY: ${WIP_KEY:-}
      WIP_STATUS: ${WIP_STATUS:-503}
      WIP_RETRY_AFTER: ${WIP_RETRY_AFTER:-3600}
      WIP_API: ${WIP_API:-open}
    entrypoint: ['/bin/sh', '/usr/local/bin/caddy-start.sh']
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./wip.caddy:/etc/caddy/wip.caddy:ro
      - ./caddy-start.sh:/usr/local/bin/caddy-start.sh:ro
      # Site du front (volume rempli par web-build) : Caddy le lit sans pouvoir l'écrire.
      - web_site:/srv/web:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    networks:
      - edge
      - app
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 100
    # Journal d'accès avec adresses IP : conservation bornée (3 x 10 Mo) sur le VPS.
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  api:
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
    image: siteperso-api:prod
    restart: unless-stopped
    expose:
      - '3000'
    environment:
      # Rôle de lecture seule (select uniquement), créé par `migrate` : l'API n'a besoin de rien d'autre.
      DATABASE_URL: postgres://siteperso_api:${API_DB_PASSWORD:?API_DB_PASSWORD requis}@postgres:5432/siteperso
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN requis}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-100}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      # Obligatoire derrière Caddy : sinon tout le trafic partage le quota de l'IP du proxy. Seuls les pairs
      # des réseaux privés (Caddy, sur le réseau Docker interne) sont crus ; jamais `true` (refusé).
      TRUST_PROXY: 'uniquelocal'
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    networks:
      - app
      - data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    pids_limit: 100
    # Déclaré ici et non seulement dans le Dockerfile (HEALTHCHECK) : `wait_for_api_health` et les
    # `depends_on: service_healthy` ne dépendent ainsi pas du format de l'image (Docker v2 ou OCI).
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/v1/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 3s
      start_period: 10s
      retries: 3

  # Applique les migrations puis les seeds (runner du lot 1 : db/migrations, db/seeds), crée ou met à jour
  # le rôle de lecture seule de l'API, puis s'arrête. Seul service qui utilise le rôle propriétaire.
  migrate:
    image: siteperso-api:prod
    pull_policy: never
    restart: 'no'
    command:
      [
        'sh',
        '-c',
        'node dist/cli/migrate.js && node dist/cli/seed.js && node dist/cli/provision-api-role.js',
      ]
    environment:
      DATABASE_URL: postgres://siteperso:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requis}@postgres:5432/siteperso
      API_DB_PASSWORD: ${API_DB_PASSWORD:?API_DB_PASSWORD requis}
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN requis}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    pids_limit: 100

  postgres:
    image: docker.io/library/postgres:16-alpine@sha256:81e77a4833487b8132fe4b00bedd39dc3f74b8641e387f19312a48f7de218c2e
    restart: unless-stopped
    environment:
      POSTGRES_DB: siteperso
      POSTGRES_USER: siteperso
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requis}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U siteperso -d siteperso']
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - data
    read_only: true
    tmpfs:
      - /tmp
      - /var/run/postgresql
    # L'entrypoint de l'image prépare le volume (chown) puis descend vers l'utilisateur postgres.
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    pids_limit: 200

  # Génération du front (BF-13) : image dédiée à la génération, volume `web_site` lu par Caddy. Profil
  # `build` : ni `up` ni `up -d --build` ne le lancent ; scripts/deploy/site.sh (publish_site) le joue après
  # que l'API est migrée, seedée et saine (`compose run --rm web-build`), puis recharge Caddy.
  # Réseau `app` seul (interne) : il joint l'API, jamais la base ni Internet. Contenu et adresse du
  # bouton de contact figés dans les pages au build (NUXT_PUBLIC_*), jamais lus à l'exécution.
  web-build:
    profiles: [build]
    build:
      context: ..
      dockerfile: docker/web.Dockerfile
    image: siteperso-web-build:prod
    restart: 'no'
    environment:
      NUXT_CV_SOURCE: api
      NUXT_API_BASE_URL: http://api:3000
      NUXT_PUBLIC_CONTACT_EMAIL: ${WEB_CONTACT_EMAIL:-}
      NUXT_PUBLIC_I18N_BASE_URL: ${PUBLIC_SITE_URL:-https://${SITE_DOMAIN:-localhost}}
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - web_site:/site
    networks:
      - app
    # Seul conteneur dont le système de fichiers n'est pas en lecture seule : Nitro vide et recrée
    # `.output` (un `tmpfs` monté dessus fait échouer `rmdir` : EROFS) et Nuxt écrit `.nuxt` et ses caches.
    # Constaté sous Docker (lot 24). Conteneur jetable (`run --rm`), sans port, sur le réseau interne
    # `app`, utilisateur `node`, sans capacité : seul le volume du site survit.
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    pids_limit: 300

networks:
  edge:
  app:
    internal: true
  data:
    internal: true

volumes:
  pgdata:
  web_site:
  caddy_data:
  caddy_config:
