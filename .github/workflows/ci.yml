name: CI

on:
  push:
  pull_request:

# Annule les runs obsolètes d'une même branche ou PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Permissions minimales : la CI ne lit que le dépôt, ne publie rien et n'utilise aucun secret.
permissions:
  contents: read

env:
  NODE_VERSION: '26.13.1'

jobs:
  qualite:
    name: Qualité (format, lint, typecheck, build, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # La version de pnpm vient du champ `packageManager` du package.json racine.
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Dépendances de production : échoue sur une vulnérabilité de gravité haute ou critique.
      - run: pnpm audit --prod --audit-level=high
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test

  e2e:
    name: Tests e2e (PostgreSQL 16)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: siteperso_test
          POSTGRES_USER: siteperso
          POSTGRES_PASSWORD: siteperso
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U siteperso -d siteperso_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgres://siteperso:siteperso@localhost:5433/siteperso_test
      CORS_ORIGIN: http://localhost:3001
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:e2e
      # Seconde passe dans un ordre de fichiers aléatoire : détecte une dépendance entre fichiers.
      - run: pnpm --filter @siteperso/api exec vitest run --config vitest.e2e.config.ts --sequence.shuffle.files

  docker:
    name: Image Docker de l'API (build sans push)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: docker build -f docker/api.Dockerfile -t siteperso-api:ci .
      - name: Vérifier le démarrage du conteneur (utilisateur non root)
        run: |
          test "$(docker run --rm siteperso-api:ci id -u)" != "0"
