name: CI

# Git flow (décision de Julien du 19 nov. 2026) : intégration sur develop, production sur main,
# branches release/* et hotfix/* fusionnées dans main par Julien, branches de lot lot/*.
# Étiquettes de version v* (L14-03) : posées par Julien à la release, elles déclenchent le run complet
# du test par mutation, seuils de rupture compris.
on:
  push:
    branches: [develop, main, 'release/**', 'hotfix/**', 'lot/**']
    tags: ['v*']
  pull_request:
  # Relance manuelle (L20-04) : amorcer les incréments de Stryker sans pousser de commit.
  workflow_dispatch:

# Annule les runs obsolètes d'une même branche ou PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Permissions minimales : la CI ne lit que le dépôt, ne publie rien et n'utilise aucun secret.
permissions:
  contents: read

env:
  NODE_VERSION: '26.13.1'

jobs:
  qualite:
    name: Qualité (format, lint, typecheck, build, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # La version de pnpm vient du champ `packageManager` du package.json racine.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Dépendances de production : échoue sur une vulnérabilité de gravité haute ou critique.
      - run: pnpm audit --prod --audit-level=high
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      # Le front lit ses données de fixtures au build (pas d'API) ; adresse de contact fictive.
      - run: pnpm build
        env:
          NUXT_CV_SOURCE: fixtures
          NUXT_PUBLIC_CONTACT_EMAIL: contact@example.org
      # Tests du pre-commit (format des fichiers indexés) : ils chargent Prettier depuis node_modules.
      - run: pnpm husky:test
      # Pas de `pnpm test` ici : les unitaires des contrats et de l'API sont exécutés par le job `e2e`
      # (`test:coverage`, projets unit et e2e) et ceux du front par le job `front` (`test:coverage`).

  garde-fous:
    name: Garde-fous (intégrité des tests, hooks des agents)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Historique complet : le script remonte au point de divergence avec la branche d'intégration.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Tests des hooks des agents
        run: node --test ".claude/hooks/tests/*.test.mjs"
      # Tous les fichiers *.test.sh (marqueurs, configurations protégées, directives Stryker disable).
      - name: Tests du script d'intégrité
        run: for t in scripts/ci/tests/*.test.sh; do bash "$t" || exit 1; done
      # Test existant modifié ou supprimé, configuration de test changée sans Justification-test,
      # marqueur de saut ou commentaire d'ignore : échec. Base = cible de la PR, sinon develop.
      - name: Intégrité des tests depuis la branche d'intégration
        env:
          BASE_REF: ${{ github.base_ref || 'develop' }}
        run: bash scripts/ci/check-tests-integrity.sh "origin/${BASE_REF}"

  e2e:
    name: Tests e2e et couverture 100 % (PostgreSQL 16)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: siteperso_test
          POSTGRES_USER: siteperso
          POSTGRES_PASSWORD: siteperso
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U siteperso -d siteperso_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgres://siteperso:siteperso@localhost:5433/siteperso_test
      CORS_ORIGIN: http://localhost:3001
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Passe fusionnée unitaires + e2e : échoue sous 100 % (lignes, branches, fonctions,
      # instructions) pour apps/api comme pour packages/contracts (seuils dans vitest.config.ts).
      # Le front est exclu : son `test:coverage` est exécuté par le job `front`.
      - run: pnpm turbo run test:coverage --filter=!@siteperso/web
      # Résumé de couverture dans le récapitulatif du run (coverage-summary.json des deux paquets).
      - name: Publier le résumé de couverture
        if: always()
        run: |
          node --input-type=module - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import { existsSync, readFileSync } from 'node:fs';
          const packages = [
            ['apps/api', 'apps/api/coverage/coverage-summary.json'],
            ['packages/contracts', 'packages/contracts/coverage/coverage-summary.json'],
          ];
          console.log('## Couverture de test (unitaires + e2e, seuil 100 %)\n');
          console.log('| Paquet | Lignes | Branches | Fonctions | Instructions |');
          console.log('|---|---|---|---|---|');
          for (const [name, file] of packages) {
            if (!existsSync(file)) {
              console.log(`| ${name} | rapport absent | | | |`);
              continue;
            }
            const { total } = JSON.parse(readFileSync(file, 'utf8'));
            const cell = (metric) => `${total[metric].pct} % (${total[metric].covered}/${total[metric].total})`;
            console.log(`| ${name} | ${cell('lines')} | ${cell('branches')} | ${cell('functions')} | ${cell('statements')} |`);
          }
          EOF
      # Rapports lcov des deux paquets, consultables depuis le run.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: couverture-lcov
          path: |
            apps/api/coverage/lcov.info
            packages/contracts/coverage/lcov.info
          if-no-files-found: error
          retention-days: 14
      # Seconde passe e2e dans un ordre de fichiers aléatoire : détecte une dépendance entre fichiers.
      - run: pnpm --filter @siteperso/api exec vitest run --project e2e --sequence.shuffle.files

  front:
    name: Front (lint, typecheck, couverture 100 %, Playwright + axe sur 7 tailles d'écran)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      # `nuxt prepare` (postinstall d'apps/web) génère les types et tsconfig de .nuxt.
      - run: pnpm install --frozen-lockfile
      # Navigateurs : même service docker compose qu'en local (image Playwright épinglée par digest,
      # même version que @playwright/test), rien d'installé sur l'exécuteur.
      - run: pnpm e2e:browsers:up
      # Unitaires + composants avec couverture fusionnée (échoue sous 100 % sur app/), puis
      # nuxt generate et parcours Playwright + axe (WCAG 2.2 AA) sur les pages générées.
      - run: pnpm turbo run lint typecheck test:coverage test:e2e --filter=@siteperso/web
        env:
          NUXT_CV_SOURCE: fixtures
          NUXT_PUBLIC_CONTACT_EMAIL: contact@example.org
      - name: Publier le résumé de couverture du front
        if: always()
        run: |
          node --input-type=module - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import { existsSync, readFileSync } from 'node:fs';
          const file = 'apps/web/coverage/coverage-summary.json';
          console.log('## Couverture du front (unitaires + composants, seuil 100 %)\n');
          if (!existsSync(file)) {
            console.log('rapport absent');
          } else {
            const { total } = JSON.parse(readFileSync(file, 'utf8'));
            const cell = (metric) => `${total[metric].pct} % (${total[metric].covered}/${total[metric].total})`;
            console.log('| Lignes | Branches | Fonctions | Instructions |');
            console.log('|---|---|---|---|');
            console.log(`| ${cell('lines')} | ${cell('branches')} | ${cell('functions')} | ${cell('statements')} |`);
          }
          EOF
      # Rapport Playwright (traces des échecs) et lcov du front, consultables depuis le run.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: front-rapports
          path: |
            apps/web/playwright-report/
            apps/web/coverage/lcov.info
          if-no-files-found: warn
          retention-days: 14
      - name: Arrêt des navigateurs
        if: always()
        run: docker compose down

  analyse-statique:
    name: Analyse statique (actionlint des workflows, shellcheck des scripts)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Images Docker épinglées par digest dans le script, même commande que `pnpm check`.
      - run: bash scripts/ci/static-analysis.sh workflows
      - run: bash scripts/ci/static-analysis.sh shell

  mutation:
    name: Test par mutation (${{ matrix.name }})
    runs-on: ubuntu-latest
    # Hors de `pnpm check` (trop long pour chaque commit), job dédié, indépendant des autres et
    # INFORMATIF : il ne figure pas dans les contrôles requis de la protection de develop (L20-04).
    # Une matrice par paquet : le job unique enchaînait les trois paquets et l'API (18 min sur 16 cœurs
    # en local) dépassait les 45 min sur l'exécuteur à 4 cœurs. Stryker n'écrit son incrément qu'en FIN
    # de run : un run interrompu par le délai n'enregistre rien et le suivant repart de zéro. D'où un
    # délai propre à chaque paquet, large pour l'API, et un cache d'incrément par paquet. Le premier
    # run complet de l'API (cache vide) l'amorce ; les suivants ne rejouent que les mutants touchés.
    # Relance manuelle possible (workflow_dispatch) pour amorcer sans pousser de commit.
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: contrats
            filter: '@siteperso/contracts'
            cache: contracts
            report: packages/contracts
            timeout: 30
          - name: API
            filter: '@siteperso/api'
            cache: api
            report: apps/api
            timeout: 150
          - name: front
            filter: '@siteperso/web'
            cache: web
            report: apps/web
            timeout: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # L14-03 : hors étiquette, mode incrémental de Stryker. Le fichier d'incrément de chaque paquet
      # (reports/stryker-incremental.json) est restauré depuis le cache du dernier run de la branche
      # (ou, pour une PR, de la branche de base) et réenregistré après le run, même en échec. Un mutant
      # dont le code et les tests n'ont pas changé reprend son statut ; le score comparé à
      # `thresholds.break` reste celui du total, donc l'incrémental ne peut abaisser aucun seuil.
      - name: Restaurer l'incrément de Stryker
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ matrix.report }}/reports/stryker-incremental.json
          key: stryker-incremental-${{ matrix.cache }}-${{ github.run_id }}
          restore-keys: stryker-incremental-${{ matrix.cache }}-
      # Le paquet échoue sous le `thresholds.break` de son stryker.config.mjs (score total, survivants
      # déclarés et sans couverture compris). Concurrence de Stryker : un processus par cœur de
      # l'exécuteur moins un, pour laisser de l'air au processus principal (sinon des timeouts de
      # mutants, comptés détectés, font varier le score).
      - name: Mutation incrémentale (hors étiquette)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: |
          workers=$(( $(nproc) > 1 ? $(nproc) - 1 : 1 ))
          pnpm exec turbo run test:mutation --filter='${{ matrix.filter }}' -- --incremental --concurrency "$workers"
      # Étiquette de version : run complet, sans incrément, seuils de rupture compris.
      - name: Mutation complète (étiquette v*)
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          workers=$(( $(nproc) > 1 ? $(nproc) - 1 : 1 ))
          pnpm exec turbo run test:mutation --filter='${{ matrix.filter }}' -- --concurrency "$workers"
      - name: Enregistrer l'incrément de Stryker
        if: ${{ always() && !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ matrix.report }}/reports/stryker-incremental.json
          key: stryker-incremental-${{ matrix.cache }}-${{ github.run_id }}
      # Rapport HTML du paquet (mutants survivants, ignorés avec leur motif), même en échec.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mutation-html-${{ matrix.cache }}
          path: ${{ matrix.report }}/reports/mutation/mutation.html
          if-no-files-found: warn
          retention-days: 14

  docker:
    name: Image Docker de l'API (build sans push)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -f docker/api.Dockerfile -t siteperso-api:ci .
      - name: Vérifier le démarrage du conteneur (utilisateur non root)
        run: |
          test "$(docker run --rm siteperso-api:ci id -u)" != "0"

  pile-locale:
    name: Pile locale complète (Caddy, API, PostgreSQL) et scénarios de production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres: # base de test exigée par le setup global du projet e2e, indépendante de la pile
        image: postgres:16-alpine
        env: { POSTGRES_DB: siteperso_test, POSTGRES_USER: siteperso, POSTGRES_PASSWORD: siteperso }
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U siteperso -d siteperso_test" --health-interval 2s
          --health-timeout 3s --health-retries 15
    env:
      DATABASE_URL: postgres://siteperso:siteperso@localhost:5433/siteperso_test
      CORS_ORIGIN: http://localhost:3001
      STACK_REQUIRED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '${{ env.NODE_VERSION }}', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm stack:up
      - run: pnpm --filter @siteperso/api exec vitest run --project e2e local-stack
      - name: Journaux (échec)
        if: failure()
        run: pnpm stack:ps && docker compose -f docker/compose.prod.yml --env-file docker/.env.local logs --no-color --tail 200
      - name: Arrêt et nettoyage
        if: always()
        run: pnpm stack:down --volumes
