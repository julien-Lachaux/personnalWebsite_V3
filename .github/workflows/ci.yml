name: CI

on:
  push:
  pull_request:

# Annule les runs obsolètes d'une même branche ou PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Permissions minimales : la CI ne lit que le dépôt, ne publie rien et n'utilise aucun secret.
permissions:
  contents: read

env:
  NODE_VERSION: '26.13.1'

jobs:
  qualite:
    name: Qualité (format, lint, typecheck, build, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # La version de pnpm vient du champ `packageManager` du package.json racine.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Dépendances de production : échoue sur une vulnérabilité de gravité haute ou critique.
      - run: pnpm audit --prod --audit-level=high
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test

  garde-fous:
    name: Garde-fous (intégrité des tests, hooks des agents)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Historique complet : le script remonte au point de divergence avec la branche d'intégration.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Tests des hooks des agents
        run: node --test ".claude/hooks/tests/*.test.mjs"
      # Tous les fichiers *.test.sh (marqueurs, configurations protégées, directives Stryker disable).
      - name: Tests du script d'intégrité
        run: for t in scripts/ci/tests/*.test.sh; do bash "$t" || exit 1; done
      # Test existant modifié ou supprimé, configuration de test changée sans Justification-test,
      # marqueur de saut ou commentaire d'ignore : échec. Base = cible de la PR, sinon v3/backend.
      - name: Intégrité des tests depuis la branche d'intégration
        env:
          BASE_REF: ${{ github.base_ref || 'v3/backend' }}
        run: bash scripts/ci/check-tests-integrity.sh "origin/${BASE_REF}"

  e2e:
    name: Tests e2e et couverture 100 % (PostgreSQL 16)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: siteperso_test
          POSTGRES_USER: siteperso
          POSTGRES_PASSWORD: siteperso
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U siteperso -d siteperso_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgres://siteperso:siteperso@localhost:5433/siteperso_test
      CORS_ORIGIN: http://localhost:3001
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Passe fusionnée unitaires + e2e : échoue sous 100 % (lignes, branches, fonctions,
      # instructions) pour apps/api comme pour packages/contracts (seuils dans vitest.config.ts).
      - run: pnpm test:coverage
      # Résumé de couverture dans le récapitulatif du run (coverage-summary.json des deux paquets).
      - name: Publier le résumé de couverture
        if: always()
        run: |
          node --input-type=module - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import { existsSync, readFileSync } from 'node:fs';
          const packages = [
            ['apps/api', 'apps/api/coverage/coverage-summary.json'],
            ['packages/contracts', 'packages/contracts/coverage/coverage-summary.json'],
          ];
          console.log('## Couverture de test (unitaires + e2e, seuil 100 %)\n');
          console.log('| Paquet | Lignes | Branches | Fonctions | Instructions |');
          console.log('|---|---|---|---|---|');
          for (const [name, file] of packages) {
            if (!existsSync(file)) {
              console.log(`| ${name} | rapport absent | | | |`);
              continue;
            }
            const { total } = JSON.parse(readFileSync(file, 'utf8'));
            const cell = (metric) => `${total[metric].pct} % (${total[metric].covered}/${total[metric].total})`;
            console.log(`| ${name} | ${cell('lines')} | ${cell('branches')} | ${cell('functions')} | ${cell('statements')} |`);
          }
          EOF
      # Rapports lcov des deux paquets, consultables depuis le run.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: couverture-lcov
          path: |
            apps/api/coverage/lcov.info
            packages/contracts/coverage/lcov.info
          if-no-files-found: error
          retention-days: 14
      # Seconde passe e2e dans un ordre de fichiers aléatoire : détecte une dépendance entre fichiers.
      - run: pnpm --filter @siteperso/api exec vitest run --project e2e --sequence.shuffle.files

  mutation:
    name: Test par mutation (Stryker, seuil de rupture par paquet)
    runs-on: ubuntu-latest
    # Hors de `pnpm check` (trop long pour chaque commit), job dédié et indépendant des autres.
    # Durée attendue : 12 à 15 min ; mesurée en local (16 fils) à 2 min 30 pour les contrats et
    # 9 min pour l'API. Stryker lance un processus par cœur : sur un exécuteur à 4 cœurs la durée
    # peut tripler, d'où une marge large, à resserrer après les premiers passages.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Contrats puis API (turbo --concurrency=1) : chaque paquet échoue sous le `thresholds.break`
      # de son stryker.config.mjs (score total, survivants déclarés et sans couverture compris).
      - run: pnpm test:mutation
      # Rapports HTML des deux paquets (mutants survivants, ignorés avec leur motif), même en échec ;
      # `warn` : si les contrats passent sous leur seuil, turbo s'arrête avant le rapport de l'API.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mutation-html
          path: |
            packages/contracts/reports/mutation/mutation.html
            apps/api/reports/mutation/mutation.html
          if-no-files-found: warn
          retention-days: 14

  docker:
    name: Image Docker de l'API (build sans push)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: docker build -f docker/api.Dockerfile -t siteperso-api:ci .
      - name: Vérifier le démarrage du conteneur (utilisateur non root)
        run: |
          test "$(docker run --rm siteperso-api:ci id -u)" != "0"

  pile-locale:
    name: Pile locale complète (Caddy, API, PostgreSQL) et scénarios de production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres: # base de test exigée par le setup global du projet e2e, indépendante de la pile
        image: postgres:16-alpine
        env: { POSTGRES_DB: siteperso_test, POSTGRES_USER: siteperso, POSTGRES_PASSWORD: siteperso }
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U siteperso -d siteperso_test" --health-interval 2s
          --health-timeout 3s --health-retries 15
    env:
      DATABASE_URL: postgres://siteperso:siteperso@localhost:5433/siteperso_test
      CORS_ORIGIN: http://localhost:3001
      STACK_REQUIRED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: '${{ env.NODE_VERSION }}', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm stack:up
      - run: pnpm --filter @siteperso/api exec vitest run --project e2e local-stack
      - name: Journaux (échec)
        if: failure()
        run: pnpm stack:ps && docker compose -f docker/compose.prod.yml --env-file docker/.env.local logs --no-color --tail 200
      - name: Arrêt et nettoyage
        if: always()
        run: pnpm stack:down --volumes
