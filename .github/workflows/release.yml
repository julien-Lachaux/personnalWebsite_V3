name: Release

# Version et changelog automatiques (lot 23, décisions de Julien du 21 nov. 2026).
#   - pull_request vers main : si la branche est release/<X.Y.Z>, contrôle que la branche, la version calculée
#     d'après les Conventional Commits, le package.json et CHANGELOG.md concordent (scripts/ci/release.mjs) ;
#   - push sur main : si la version du package.json n'est pas encore étiquetée et que CHANGELOG.md a sa
#     section, pose l'étiquette vX.Y.Z et crée la release GitHub avec cette section. Un hotfix poussé
#     directement sans toucher version ni changelog ne crée aucune étiquette.
#   - lot 33 (production tout statique, décision de Julien du 25 nov. 2026) : après l'étiquetage, le job « site »
#     du MÊME workflow (lecture seule) génère le front contre l'API (PostgreSQL de service, migrations, seeds),
#     relève la CSP et produit `site-<version>.tar.gz` et sa somme SHA-256 (scripts/deploy/build-site-archive.sh),
#     que le job « publier » (écriture, sans code du dépôt) joint à la release. Le
#     serveur ne fait que télécharger et vérifier cette archive (scripts/deploy/deploy-static.sh). Variables du
#     dépôt GitHub exigées (Settings > Secrets and variables > Actions > Variables) : SITE_CONTACT_EMAIL (adresse
#     du bouton de contact) et SITE_BASE_URL (origine https publique du site, sans barre finale) ; absentes, le
#     job échoue avant toute génération. Il est rejouable (`gh run rerun --failed`) : `--clobber` à l'envoi.
# Aucun robot n'écrit sur main ni sur la branche de release : la version et le changelog sont commités
# par la session principale (pnpm release:prepare) et relus par Julien dans la pull request.
#
# Limite connue : une étiquette créée avec le GITHUB_TOKEN ne déclenche aucun autre workflow (règle de
# GitHub contre les boucles). Un futur déploiement « sur étiquette » (L14-05) ne partirait donc pas de
# celle-ci : voir docs/deploiement.md, « Version et changelog ».
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

# Permissions minimales : lecture seule par défaut, écriture du contenu donnée aux seuls jobs qui n'exécutent
# aucune dépendance : « etiquette » (étiquette, release) et « publier » (archive du site jointe à la release).
permissions:
  contents: read

env:
  NODE_VERSION: '26.13.1'

jobs:
  controle:
    name: Contrôle de la release
    # Seules les branches release/* sont contrôlées (un job ignoré compte comme réussi pour une protection).
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'release/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Branche, version calculée, package.json et CHANGELOG concordent
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: node scripts/ci/release.mjs check "$HEAD_REF"

  etiquette:
    name: Étiquette et release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    # Jamais deux étiquetages en même temps, jamais annulés en cours.
    concurrency:
      group: release-tag
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Version à étiqueter
        id: version
        run: echo "version=$(node scripts/ci/release.mjs should-tag)" >>"$GITHUB_OUTPUT"
      - name: Étiquette vX.Y.Z et release GitHub
        if: steps.version.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          node scripts/ci/release.mjs notes "$VERSION" >"$RUNNER_TEMP/notes.md"
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "v$VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md"

  site:
    name: Site statique de la release
    needs: etiquette
    # Rien à joindre quand aucune étiquette n'a été posée (hotfix sans version).
    if: needs.etiquette.outputs.version != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Lecture seule : ce job exécute tout l'arbre de dépendances (installation, build, API, génération). Le
    # jeton d'écriture est réservé au job « publier », qui n'installe ni n'exécute rien du dépôt.
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: siteperso_site
          POSTGRES_USER: siteperso
          POSTGRES_PASSWORD: siteperso
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U siteperso -d siteperso_site"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgres://siteperso:siteperso@localhost:5433/siteperso_site
      CORS_ORIGIN: http://localhost:3001
      HOST: 127.0.0.1
      PORT: '3000'
      VERSION: ${{ needs.etiquette.outputs.version }}
      # Valeurs publiques figées dans les pages au build : variables du dépôt, jamais dans le code.
      NUXT_PUBLIC_CONTACT_EMAIL: ${{ vars.SITE_CONTACT_EMAIL }}
      NUXT_PUBLIC_I18N_BASE_URL: ${{ vars.SITE_BASE_URL }}
    steps:
      - name: Variables du dépôt présentes
        run: |
          if [ -z "$NUXT_PUBLIC_CONTACT_EMAIL" ] || [ -z "$NUXT_PUBLIC_I18N_BASE_URL" ]; then
            echo "::error::variables de dépôt SITE_CONTACT_EMAIL et SITE_BASE_URL requises (docs/deploiement.md, « Production tout statique »)"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Contrats puis API compilés (dépendance `^build` de Turborepo).
      - run: pnpm turbo run build --filter=@siteperso/api
      - name: Migrations et seeds
        working-directory: apps/api
        run: |
          node dist/cli/migrate.js
          node dist/cli/seed.js
      - name: API de génération
        working-directory: apps/api
        run: |
          node dist/main.js >"$RUNNER_TEMP/api.log" 2>&1 &
          for _ in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/api/v1/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/api.log"
          echo "::error::l'API ne répond pas"
          exit 1
      - name: Archive du site (génération, contrôle des pages, CSP)
        run: bash scripts/deploy/build-site-archive.sh "$VERSION" "$RUNNER_TEMP/site"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-${{ env.VERSION }}
          path: |
            ${{ runner.temp }}/site/site-${{ env.VERSION }}.tar.gz
            ${{ runner.temp }}/site/site-${{ env.VERSION }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1

  publier:
    name: Publication du site dans la release
    needs: [etiquette, site]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Seul job du lot 33 qui écrit : ni checkout, ni installation, ni code du dépôt exécuté.
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.etiquette.outputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-${{ env.VERSION }}
          path: ${{ runner.temp }}/site
      - name: Somme vérifiée, archive et somme jointes à la release
        working-directory: ${{ runner.temp }}/site
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          sha256sum --check "site-$VERSION.tar.gz.sha256"
          gh release upload "v$VERSION" "site-$VERSION.tar.gz" "site-$VERSION.tar.gz.sha256" --clobber
