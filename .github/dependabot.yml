# Mises à jour automatiques (pull requests) : les actions et les images sont épinglées par SHA ou
# digest, donc ne bougent plus toutes seules ; Dependabot propose le nouveau SHA ou digest.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
  - package-ecosystem: docker-compose
    directory: /docker
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
